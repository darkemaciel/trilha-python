databases:
  - name: fastapi-crud-db
    plan: free
    databaseName: fastapi_crud
    user: fastapi_crud

services:
  - type: web
    name: fastapi-crud
    runtime: docker
    dockerfilePath: "07 - FastAPI/Dockerfile"
    dockerContext: "07 - FastAPI"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fastapi-crud-db
          property: connectionString
